<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>眼睛休息提醒</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        --page: #e9f0ed;
        --surface: #f8fbfa;
        --surface-muted: #eef5f1;
        --text: #1d2a26;
        --muted: #61736c;
        --accent: #3d8875;
        --accent-strong: #2e6f5f;
        --accent-soft: #dceee8;
        --border: #d4e2dc;
        --focus: #b47425;
        --shadow: 0 14px 34px rgba(42, 74, 64, 0.18);
      }

      /**
       * @brief 为提醒卡片提供柔和的背景层，避免默认系统色造成的空白感。
       */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 6px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 18% 12%, rgba(112, 177, 153, 0.24), transparent 38%),
          linear-gradient(145deg, var(--page), #dfeae5);
        color: var(--text);
      }

      main {
        box-sizing: border-box;
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: calc(100vh - 12px);
        min-height: 176px;
        padding: 14px 20px 12px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: var(--shadow);
        text-align: center;
      }

      main::before {
        content: "";
        position: absolute;
        z-index: -1;
        top: -84px;
        right: -54px;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent-soft), transparent 68%);
        pointer-events: none;
      }

      .reminder-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 0 0 12px;
        text-align: left;
      }

      .title-group {
        min-width: 0;
      }

      .eyebrow {
        margin: 0 0 3px;
        color: var(--accent-strong);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .mark {
        position: relative;
        display: inline-grid;
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--accent);
      }

      .mark::before {
        content: "";
        width: 12px;
        height: 7px;
        border: 1.5px solid currentColor;
        border-radius: 100% 0 100% 0;
        transform: rotate(-45deg);
      }

      .mark::after {
        content: "";
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: currentColor;
      }

      h1 {
        margin: 0;
        color: var(--text);
        font-size: 21px;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .message {
        align-self: center;
        max-width: 340px;
        text-align: center;
      }

      .action-status {
        min-height: 1.35em;
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
        text-align: center;
      }

      .action-status.error {
        color: #a63f3c;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: stretch;
        width: 100%;
        gap: 10px;
        margin-top: auto;
        padding-top: 16px;
      }

      button {
        width: 100%;
        min-width: 0;
        min-height: 38px;
        padding: 8px 14px;
        border: 1px solid transparent;
        border-radius: 11px;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
      }

      #complete {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #ffffff;
        box-shadow: 0 7px 16px rgba(49, 117, 98, 0.24);
      }

      #snooze {
        border-color: var(--border);
        background: var(--surface-muted);
        color: var(--accent-strong);
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      #complete:hover:not(:disabled) {
        box-shadow: 0 9px 20px rgba(49, 117, 98, 0.3);
      }

      #snooze:hover:not(:disabled) {
        background: var(--accent-soft);
      }

      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #111b18;
          --surface: #1a2723;
          --surface-muted: #21332d;
          --text: #e5efea;
          --muted: #a8bbb3;
          --accent: #79c4aa;
          --accent-strong: #9ad7bf;
          --accent-soft: #24463b;
          --border: #345148;
          --focus: #e5b267;
          --shadow: 0 14px 34px rgba(0, 0, 0, 0.3);
        }

        body {
          background:
            radial-gradient(circle at 18% 12%, rgba(68, 127, 105, 0.22), transparent 38%),
            linear-gradient(145deg, var(--page), #15231f);
        }

        #complete {
          color: #10221c;
        }

        .action-status.error {
          color: #ffb4ab;
        }
      }

      @media (forced-colors: active) {
        main {
          border-color: CanvasText;
          background: Canvas;
          box-shadow: none;
        }

        .mark,
        #snooze {
          border: 1px solid ButtonText;
          background: ButtonFace;
          color: ButtonText;
        }

        #complete {
          border-color: ButtonText;
          background: Highlight;
          color: HighlightText;
          box-shadow: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: surface-in 180ms ease-out both;
        }

        @keyframes surface-in {
          from {
            opacity: 0;
            transform: translateY(5px) scale(0.99);
          }

          to {
            opacity: 1;
            transform: translateY(0) scale(1);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="reminder-header">
        <span class="mark" aria-hidden="true"></span>
        <div class="title-group">
          <p class="eyebrow">短暂离屏</p>
          <h1>眼睛休息提醒</h1>
        </div>
      </header>
      <p class="message">请眺望约 6 米（20 英尺）外至少 20 秒，让眼睛休息一下。</p>
      <p id="action-status" class="action-status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="complete" type="button">已休息</button>
        <button id="snooze" type="button">推迟 3 分钟</button>
      </div>
    </main>
    <script>
      const DEFAULT_SNOOZE_MINUTES = 3;
      const MIN_SNOOZE_MINUTES = 1;
      const MAX_SNOOZE_MINUTES = 10;
      const completeButton = document.getElementById("complete");
      const snoozeButton = document.getElementById("snooze");
      const actionStatus = document.getElementById("action-status");
      let actionInProgress = false;

      /**
       * @brief 从主进程传入的查询参数读取推迟分钟数。
       */
      function readSnoozeMinutes() {
        const value = Number(
          new URLSearchParams(window.location.search).get("snoozeMinutes")
        );

        if (
          Number.isInteger(value) &&
          value >= MIN_SNOOZE_MINUTES &&
          value <= MAX_SNOOZE_MINUTES
        )
          return value;

        return DEFAULT_SNOOZE_MINUTES;
      }

      /**
       * @brief 更新提醒动作的可见状态，避免 IPC 异常被静默吞掉。
       */
      function showActionStatus(text, isError = false) {
        actionStatus.textContent = text;
        actionStatus.classList.toggle("error", isError);
      }

      /**
       * @brief 恢复按钮状态，允许用户在动作失败后再次提交。
       */
      function resetActionControls() {
        actionInProgress = false;
        completeButton.disabled = false;
        snoozeButton.disabled = false;
      }

      /**
       * @brief 向主进程提交提醒窗口动作，并等待调度器确认。
       */
      async function dispatchReminderAction(action) {
        if (actionInProgress)
          return;

        actionInProgress = true;
        completeButton.disabled = true;
        snoozeButton.disabled = true;
        showActionStatus("");

        try {
          const accepted = await action();
          if (!accepted) {
            showActionStatus("提醒状态已变化，请稍后重试。", true);
            resetActionControls();
          }
        } catch {
          console.error("Reminder action failed");
          showActionStatus("操作失败，请重试。", true);
          resetActionControls();
        }
      }

      /**
       * @brief 提交已休息动作。
       */
      function completeReminder() {
        return dispatchReminderAction(() => window.electronApi.completeReminder());
      }

      /**
       * @brief 提交推迟动作。
       */
      function snoozeReminder() {
        return dispatchReminderAction(() => window.electronApi.snoozeReminder());
      }

      snoozeButton.textContent = `推迟 ${readSnoozeMinutes()} 分钟`;
      completeButton.addEventListener("click", () => {
        void completeReminder();
      });
      snoozeButton.addEventListener("click", () => {
        void snoozeReminder();
      });

      /**
       * @brief 保证键盘行为只允许完成动作和按钮间自然切换。
       */
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          event.stopPropagation();
          return;
        }

        if (event.key === "Enter") {
          event.preventDefault();
          void completeReminder();
        }
      });

      completeButton.focus();
    </script>
  </body>
</html>
